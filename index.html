<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Filme / Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0d0d11;
      --accent-red: #ff2a2a;
      --accent-blue: #0a84ff;
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Moldura Principal do Player */
    .player-card {
      width: 100%;
      background: #000000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Proporção 16:9 Cinema */
      background: #000000;
      overflow: hidden;
    }

    #playerSlot,
    #nativeVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    #playerIframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* ESCUDOS DE BLINDAGEM CIRÚRGICA:
       Bloqueiam 100% qualquer clique que abriria o site original, espelho, logo, canal ou compartilhamento.
       O topo inteiro (onde ficam links, logos e canais) fica completamente bloqueado. */
    .shield-top-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      z-index: 38;
      background: transparent;
      pointer-events: all;
      cursor: default;
    }

    .shield-corner-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 110px;
      height: 75px;
      z-index: 39;
      background: transparent;
      pointer-events: all;
      cursor: default;
    }

    /* Indicador central ao clicar no vídeo */
    .center-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 72px;
      height: 72px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 35;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .center-indicator.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .center-indicator svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    /* BARRA DE CONTROLES EXATAMENTE IGUAL À FOTO */
    .custom-controls {
      width: 100%;
      background: #0a0a0d;
      padding: 10px 18px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Barra de progresso (scrubber vermelho fino e elegante) */
    .scrub-bar-container {
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .scrub-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      transition: height 0.15s ease;
    }

    .scrub-bar-container:hover .scrub-track {
      height: 6px;
    }

    .scrub-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: var(--accent-red);
      border-radius: 2px;
    }

    .scrub-handle {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 13px;
      height: 13px;
      background: var(--accent-red);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .scrub-bar-container:hover .scrub-handle {
      opacity: 1;
    }

    /* Linha de botões da barra (Play, Voltar ao Início, Mute, Tempo, Tela Cheia) */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-ctrl {
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, color 0.15s ease;
    }

    .btn-ctrl:hover {
      color: var(--accent-blue);
      transform: scale(1.1);
    }

    .btn-ctrl:active {
      transform: scale(0.92);
    }

    .btn-ctrl svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .time-display {
      font-size: 13px;
      font-weight: 500;
      color: #e4e4e7;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* DETALHES INFERIORES: EXATAMENTE IGUAL À FOTO
       ♪ CANTOR / ARTISTA (em azul ciano)
       Filme / Cinema (em branco negrito) */
    .meta-card {
      width: 100%;
      padding: 22px 26px;
      background: linear-gradient(180deg, #111116 0%, #09090c 100%);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-artist {
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .meta-track {
      font-size: 1.15rem;
      font-weight: 500;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-year {
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      color: #e4e4e7;
    }

    /* Botão flutuante moderno para Ativar Som em Celulares (Autoplay com áudio) */
    .unmute-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 45;
      background: linear-gradient(135deg, #0a84ff 0%, #0066cc 100%);
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 22px rgba(10, 132, 255, 0.6);
      animation: pulseBadge 2.2s infinite ease-in-out;
      transition: all 0.25s ease;
      outline: none;
    }

    .unmute-badge:hover {
      transform: scale(1.06);
      background: linear-gradient(135deg, #2b95ff 0%, #0077ee 100%);
      box-shadow: 0 6px 28px rgba(10, 132, 255, 0.8);
    }

    .unmute-badge:active {
      transform: scale(0.96);
    }

    @keyframes pulseBadge {
      0%, 100% {
        box-shadow: 0 4px 20px rgba(10, 132, 255, 0.5);
      }
      50% {
        box-shadow: 0 6px 30px rgba(10, 132, 255, 0.9);
      }
    }

    /* Tela para quando a página é aberta sem link no endereço (Segurança total) */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #40404a;
      padding: 70px 20px;
      text-align: center;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      fill: #222228;
    }

    .empty-state p {
      font-size: 15px;
      font-weight: 500;
      color: #52525b;
      letter-spacing: 0.02em;
    }

    /* ========================================================
       TELA CHEIA (FULLSCREEN) PERFEITA PARA SMARTPHONES E DESKTOP
       ======================================================== */
    .player-card:fullscreen,
    .player-card:-webkit-full-screen,
    .video-viewport:fullscreen,
    .video-viewport:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      background: #000000 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      overflow: hidden !important;
      box-shadow: none !important;
    }

    .player-card:fullscreen .video-viewport,
    .player-card:-webkit-full-screen .video-viewport {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      padding-top: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }

    .player-card:fullscreen #playerSlot,
    .player-card:-webkit-full-screen #playerSlot,
    .player-card:fullscreen #playerIframe,
    .player-card:-webkit-full-screen #playerIframe,
    .player-card:fullscreen #nativeVideo,
    .player-card:-webkit-full-screen #nativeVideo {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain !important;
      object-position: center center !important;
    }

    .player-card:fullscreen .custom-controls,
    .player-card:-webkit-full-screen .custom-controls {
      position: absolute !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      z-index: 50 !important;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.9) 100%) !important;
      border-top: none !important;
      padding: 12px 24px calc(env(safe-area-inset-bottom, 14px) + 10px) 24px !important;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease !important;
    }

    .player-card:fullscreen .meta-card,
    .player-card:-webkit-full-screen .meta-card {
      display: none !important;
    }

    .controls-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: translateY(15px) !important;
    }

    /* MODO PAISAGEM AUTOMÁTICO EM CELULAR */
    @media (max-height: 540px) and (orientation: landscape) {
      body {
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        justify-content: center !important;
      }
      .container {
        max-width: 100% !important;
        height: 100vh !important;
        height: 100dvh !important;
        gap: 0 !important;
      }
      .player-card {
        border-radius: 0 !important;
        border: none !important;
        height: 100vh !important;
        height: 100dvh !important;
        width: 100vw !important;
        box-shadow: none !important;
      }
      .video-viewport {
        padding-top: 0 !important;
        height: 100vh !important;
        height: 100dvh !important;
        width: 100vw !important;
      }
      #playerSlot, #playerIframe, #nativeVideo {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        object-fit: contain !important;
        object-position: center center !important;
      }
      .custom-controls {
        position: absolute !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 50 !important;
        background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.9) 100%) !important;
        border-top: none !important;
        padding: 10px 24px calc(env(safe-area-inset-bottom, 12px) + 8px) 24px !important;
      }
      .meta-card {
        display: none !important;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

<div class="container" id="mainContainer">

  <!-- Card do Player Principal -->
  <div class="player-card" id="playerCard" style="display: none;">
    
    <div class="video-viewport" id="viewport">
      <!-- Slot onde o player embutido roda de forma protegida -->
      <div id="playerSlot"></div>

      <!-- Vídeo Nativo para streams e arquivos diretos -->
      <video id="nativeVideo" preload="metadata" playsinline style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000;pointer-events:none;"></video>

      <!-- ESCUDOS ANTI-LINK E ANTI-ESPELHO:
           Bloqueiam cliques no cabeçalho superior inteiro (onde ficam canais, logo e compartilhamento) -->
      <div class="shield-top-full" id="shieldTopFull" title="Filme em Reprodução"></div>
      <div class="shield-corner-right" id="shieldCornerRight"></div>

      <!-- Botão flutuante para Ativar Som no Celular / Autoplay -->
      <button class="unmute-badge" id="unmuteBtn" style="display:none;" title="Toque para ativar o som">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span>Toque para Ativar Som</span>
      </button>

      <!-- Indicador de Play/Pause central -->
      <div class="center-indicator" id="centerIndicator">
        <svg id="indicatorIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <!-- CONTROLES NATIVOS PRÓPRIOS (IGUAL À FOTO) -->
    <div class="custom-controls" id="customControls">
      <!-- Barra de progresso vermelha -->
      <div class="scrub-bar-container" id="scrubContainer">
        <div class="scrub-track">
          <div class="scrub-fill" id="scrubFill"></div>
          <div class="scrub-handle" id="scrubHandle"></div>
        </div>
      </div>

      <!-- Botões de Reprodução -->
      <div class="controls-row">
        <div class="controls-left">
          <!-- Play / Pause -->
          <button class="btn-ctrl" id="btnPlayPause" title="Reproduzir / Pausar">
            <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>

          <!-- Voltar para o início (Replay imediato do filme) -->
          <button class="btn-ctrl" id="btnRestart" title="Voltar para o início">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>

          <!-- Mudo / Som -->
          <button class="btn-ctrl" id="btnMute" title="Ativar / Desativar Som">
            <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>

          <!-- Contador de Tempo: 0:00 / 0:00 -->
          <div class="time-display">
            <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
          </div>
        </div>

        <div class="controls-right">
          <!-- Tela Cheia -->
          <button class="btn-ctrl" id="btnFs" title="Tela Cheia">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Metadados: EXATAMENTE IGUAL À FOTO FORNECIDA -->
    <div class="meta-card" id="metaCard">
      <div class="meta-tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        CANTOR / ARTISTA
      </div>
      <div class="meta-artist" id="artistDisplay">Filme / Cinema</div>
      <div class="meta-track" id="trackContainer" style="display: none;">
        <span id="trackDisplay"></span>
        <span class="meta-year" id="yearDisplay" style="display: none;">HD 1080p</span>
      </div>
    </div>
  </div>

  <!-- Tela quando aberta sem link na barra (Privado) -->
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    <p>Nenhum vídeo carregado</p>
  </div>

</div>

<script>
  let isPlaying = true;
  let isMuted = false;
  let isNative = false;
  let currentEmbedId = null;
  let currentRawUrl = '';
  let wakeLock = null;
  let fallbackWakeVideo = null;
  let progressInterval = null;
  let simulatedCurrentTime = 0;
  let simulatedDuration = 0;

  // Bloqueio de desligamento de tela (Wake Lock) para celulares
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        if (!wakeLock || wakeLock.released) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (err) {}
    } else {
      try {
        if (!fallbackWakeVideo) {
          fallbackWakeVideo = document.createElement('video');
          fallbackWakeVideo.setAttribute('playsinline', '');
          fallbackWakeVideo.setAttribute('webkit-playsinline', '');
          fallbackWakeVideo.setAttribute('loop', '');
          fallbackWakeVideo.setAttribute('muted', '');
          fallbackWakeVideo.muted = true;
          fallbackWakeVideo.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;opacity:0;pointer-events:none;';
          fallbackWakeVideo.src = 'data:video/mp4;base64,AAAAHGZ0eXBpc29tAAAAAGlzb21tcDQxAAAACHZtZWhkAAAAAAAABnN0dHMAAAAAAAAAAHYAAAAgc3RzegAAAAAAAAAAAAAAAHgAAAAUc3RjbwAAAAAAAAABAAAALAAAAG1kYXQ=';
          document.body.appendChild(fallbackWakeVideo);
        }
        fallbackWakeVideo.play().catch(() => {});
      } catch (e) {}
    }
  }

  async function releaseWakeLock() {
    if (wakeLock && !wakeLock.released) {
      try { await wakeLock.release(); } catch (err) {}
      wakeLock = null;
    }
    if (fallbackWakeVideo) {
      try { fallbackWakeVideo.pause(); } catch (e) {}
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isPlaying) {
      requestWakeLock();
    }
  });

  const playerCard = document.getElementById('playerCard');
  const emptyState = document.getElementById('emptyState');
  const viewport = document.getElementById('viewport');
  const nativeVideo = document.getElementById('nativeVideo');
  const playerSlot = document.getElementById('playerSlot');
  const customControls = document.getElementById('customControls');
  const shieldTopFull = document.getElementById('shieldTopFull');
  const shieldCornerRight = document.getElementById('shieldCornerRight');
  const unmuteBtn = document.getElementById('unmuteBtn');
  const centerIndicator = document.getElementById('centerIndicator');
  const indicatorIcon = document.getElementById('indicatorIcon');

  const btnPlayPause = document.getElementById('btnPlayPause');
  const playPauseIcon = document.getElementById('playPauseIcon');
  const btnRestart = document.getElementById('btnRestart');
  const btnMute = document.getElementById('btnMute');
  const volumeIcon = document.getElementById('volumeIcon');
  const currentTimeDisplay = document.getElementById('currentTime');
  const totalTimeDisplay = document.getElementById('totalTime');
  const scrubContainer = document.getElementById('scrubContainer');
  const scrubFill = document.getElementById('scrubFill');
  const scrubHandle = document.getElementById('scrubHandle');
  const btnFs = document.getElementById('btnFs');

  const artistDisplay = document.getElementById('artistDisplay');
  const trackDisplay = document.getElementById('trackDisplay');
  const yearDisplay = document.getElementById('yearDisplay');

  // Bloqueio de menu de contexto (clique direito)
  document.addEventListener('contextmenu', e => e.preventDefault());

  function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "0:00";
    const totalSecs = Math.floor(seconds);
    const hours = Math.floor(totalSecs / 3600);
    const mins = Math.floor((totalSecs % 3600) / 60);
    const secs = totalSecs % 60;
    const pad = (n) => (n < 10 ? '0' + n : n);
    if (hours > 0) {
      return `${hours}:${pad(mins)}:${pad(secs)}`;
    }
    return `${mins}:${pad(secs)}`;
  }

  // Extrai ID de qualquer formato de link do site (incluindo m.ok.ru e ok.ru)
  function extractMediaId(url) {
    if (!url) return null;
    const str = url.trim();

    // Formato m.ok.ru ou ok.ru /video/ID ou /videoembed/ID
    const videoMatch = str.match(/(?:m\.)?ok\.ru\/(?:video|videoembed|live)\/(\d+)/i);
    if (videoMatch) return videoMatch[1];

    // Formato apenas com número do vídeo (ID direto com 10 a 16 dígitos)
    const pureIdMatch = str.match(/\b(\d{10,16})\b/);
    if (pureIdMatch) return pureIdMatch[1];

    return null;
  }

  // Atualiza ícone do botão Play/Pause
  function updatePlayPauseIcon(playing) {
    if (playing) {
      playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      indicatorIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    } else {
      playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      indicatorIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  // Efeito visual no indicador central
  function flashCenterIndicator(isPlayingState) {
    updatePlayPauseIcon(isPlayingState);
    centerIndicator.classList.add('show');
    setTimeout(() => centerIndicator.classList.remove('show'), 380);
  }

  // BOTÃO: VOLTAR PARA O INÍCIO (Reinicia o filme imediatamente do segundo 00:00)
  function reiniciarFilmeDoInicio() {
    if (isNative) {
      nativeVideo.currentTime = 0;
      nativeVideo.play().catch(() => {});
      isPlaying = true;
      updatePlayPauseIcon(true);
      flashCenterIndicator(true);
      return;
    }

    if (currentEmbedId) {
      // Recarrega o iframe blindado do início absoluto com autoplay
      carregarIframeBlindado(currentEmbedId, true);
      simulatedCurrentTime = 0;
      currentTimeDisplay.textContent = "0:00";
      scrubFill.style.width = '0%';
      scrubHandle.style.left = '0%';
      isPlaying = true;
      updatePlayPauseIcon(true);
      flashCenterIndicator(true);
    }
  }

  btnRestart.onclick = reiniciarFilmeDoInicio;

  // BOTÃO: PLAY / PAUSE
  function togglePlayPause() {
    if (isNative) {
      if (nativeVideo.paused) {
        nativeVideo.play().then(() => {
          isPlaying = true;
          updatePlayPauseIcon(true);
          flashCenterIndicator(true);
          requestWakeLock();
        }).catch(() => {});
      } else {
        nativeVideo.pause();
        isPlaying = false;
        updatePlayPauseIcon(false);
        flashCenterIndicator(false);
        releaseWakeLock();
      }
      return;
    }

    const iframe = document.getElementById('playerIframe');
    if (iframe && iframe.contentWindow) {
      try {
        if (isPlaying) {
          // Pausa
          iframe.contentWindow.postMessage({ method: 'pause' }, '*');
          iframe.contentWindow.postMessage({ call: 'pause' }, '*');
          isPlaying = false;
          updatePlayPauseIcon(false);
          flashCenterIndicator(false);
          releaseWakeLock();
        } else {
          // Play
          iframe.contentWindow.postMessage({ method: 'play' }, '*');
          iframe.contentWindow.postMessage({ call: 'play' }, '*');
          isPlaying = true;
          updatePlayPauseIcon(true);
          flashCenterIndicator(true);
          requestWakeLock();
        }
      } catch (e) {}
    }
  }

  btnPlayPause.onclick = togglePlayPause;

  // Alterna Mudo / Som
  btnMute.onclick = () => {
    isMuted = !isMuted;
    if (isNative) {
      nativeVideo.muted = isMuted;
    }
    const iframe = document.getElementById('playerIframe');
    if (iframe && iframe.contentWindow) {
      try {
        iframe.contentWindow.postMessage({ method: isMuted ? 'mute' : 'unmute' }, '*');
        iframe.contentWindow.postMessage({ call: 'toggleMute', val: isMuted }, '*');
      } catch (e) {}
    }

    if (isMuted) {
      volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    } else {
      volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }
  };

  // Botão flutuante de ativar som no celular
  if (unmuteBtn) {
    unmuteBtn.onclick = () => {
      isMuted = false;
      const iframe = document.getElementById('playerIframe');
      if (iframe && iframe.contentWindow) {
        try {
          iframe.contentWindow.postMessage({ method: 'unmute' }, '*');
          iframe.contentWindow.postMessage({ method: 'set_volume', volume: 1 }, '*');
        } catch (e) {}
      }
      unmuteBtn.style.opacity = '0';
      setTimeout(() => { unmuteBtn.style.display = 'none'; }, 280);
    };
  }

  // Intercepta mensagens do player embutido
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.event === 'timeupdate' || e.data.currentTime) {
      const cur = e.data.currentTime || e.data.time || 0;
      const dur = e.data.duration || simulatedDuration;
      if (cur > 0) {
        currentTimeDisplay.textContent = formatTime(cur);
        if (dur > 0) {
          totalTimeDisplay.textContent = formatTime(dur);
          const pct = Math.min(100, (cur / dur) * 100);
          scrubFill.style.width = pct + '%';
          scrubHandle.style.left = pct + '%';
        }
      }
    }
    if (e.data.event === 'volumechange' || (e.data.muted === false && e.data.volume > 0)) {
      if (unmuteBtn) {
        unmuteBtn.style.opacity = '0';
        setTimeout(() => { unmuteBtn.style.display = 'none'; }, 280);
      }
    }
  });

  // Tela Cheia Inteligente
  btnFs.onclick = async () => {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs) {
      try {
        if (playerCard.requestFullscreen) {
          await playerCard.requestFullscreen();
        } else if (playerCard.webkitRequestFullscreen) {
          await playerCard.webkitRequestFullscreen();
        } else if (viewport.requestFullscreen) {
          await viewport.requestFullscreen();
        } else if (nativeVideo.webkitEnterFullscreen) {
          nativeVideo.webkitEnterFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (err) {}
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }
  };

  function onFullscreenChange() {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    const fsIcon = btnFs.querySelector('svg');
    if (isFs) {
      fsIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
    } else {
      fsIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
      customControls.classList.remove('controls-hidden');
    }
  }

  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);

  // Ocultação automática dos controles em tela cheia
  let controlsHideTimeout = null;
  function resetControlsHideTimer() {
    clearTimeout(controlsHideTimeout);
    const isFs = document.fullscreenElement || document.webkitFullscreenElement || (window.innerHeight < 540 && window.innerWidth > window.innerHeight);
    if (isFs && isPlaying) {
      controlsHideTimeout = setTimeout(() => {
        customControls.classList.add('controls-hidden');
      }, 3500);
    }
  }

  viewport.addEventListener('mousemove', () => {
    customControls.classList.remove('controls-hidden');
    resetControlsHideTimer();
  });

  viewport.addEventListener('touchstart', () => {
    customControls.classList.remove('controls-hidden');
    resetControlsHideTimer();
  }, { passive: true });

  // Renderiza Iframe Blindado sem links externos
  function carregarIframeBlindado(mediaId, forceAutoplay = true) {
    currentEmbedId = mediaId;
    isNative = false;
    nativeVideo.style.display = 'none';
    try { nativeVideo.pause(); } catch (e) {}

    playerSlot.style.display = 'block';
    emptyState.style.display = 'none';
    playerCard.style.display = 'block';

    // Cria Iframe com Sandbox Ultra-Seguro:
    // Permite execução do vídeo sem permitir window.open(), popups, links target=_blank ou redirecionamento
    playerSlot.innerHTML = `
      <iframe id="playerIframe" 
              src="https://ok.ru/videoembed/${mediaId}?autoplay=${forceAutoplay ? 1 : 0}" 
              sandbox="allow-scripts allow-same-origin" 
              allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
              allowfullscreen>
      </iframe>
    `;

    // Escudos ativos
    shieldTopFull.style.display = 'block';
    shieldCornerRight.style.display = 'block';

    // Botão auxiliar de som para dispositivos móveis
    unmuteBtn.style.display = 'flex';
    unmuteBtn.style.opacity = '1';
    setTimeout(() => {
      if (unmuteBtn) {
        unmuteBtn.style.opacity = '0';
        setTimeout(() => { unmuteBtn.style.display = 'none'; }, 350);
      }
    }, 8500);

    requestWakeLock();
    isPlaying = true;
    updatePlayPauseIcon(true);
  }

  // Carregamento de vídeo a partir de URL ou Parâmetros
  function carregarVideo(rawInput) {
    if (!rawInput || !rawInput.trim()) {
      playerCard.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }

    const input = rawInput.trim();
    currentRawUrl = input;

    // Extrai título customizado se passado nos parâmetros (ex: #url=...&title=MeuFilme)
    let customTitle = '';
    let customYear = '';
    if (input.includes('&') || input.includes('?')) {
      const matchTitle = input.match(/[?&]t(?:itle)?=([^&]+)/i);
      if (matchTitle) customTitle = decodeURIComponent(matchTitle[1].replace(/\+/g, ' '));
      const matchYear = input.match(/[?&]y(?:ear)?=([^&]+)/i);
      if (matchYear) customYear = decodeURIComponent(matchYear[1]);
    }

    // Identifica ID do filme
    const mediaId = extractMediaId(input);

    if (mediaId) {
      carregarIframeBlindado(mediaId, true);

      // Metadados visuais: exatamente idêntico à foto
      artistDisplay.textContent = "Filme / Cinema";
      const trackContainer = document.getElementById('trackContainer');
      if (customTitle) {
        trackDisplay.textContent = customTitle;
        trackContainer.style.display = 'flex';
        if (customYear) {
          yearDisplay.textContent = customYear;
          yearDisplay.style.display = 'inline-block';
        } else {
          yearDisplay.style.display = 'none';
        }
      } else {
        trackContainer.style.display = 'none';
      }

    } else if (input.startsWith('http://') || input.startsWith('https://') || input.includes('.mp4') || input.includes('.mkv')) {
      // Modo stream direto / MP4
      isNative = true;
      currentEmbedId = null;
      playerSlot.style.display = 'none';
      nativeVideo.style.display = 'block';
      emptyState.style.display = 'none';
      playerCard.style.display = 'block';
      shieldTopFull.style.display = 'none';
      shieldCornerRight.style.display = 'none';
      unmuteBtn.style.display = 'none';

      artistDisplay.textContent = "Filme / Cinema";
      trackDisplay.textContent = customTitle || "Filme em Transmissão";
      yearDisplay.textContent = customYear || "HD 1080p";
      yearDisplay.style.display = 'inline-block';

      nativeVideo.src = input;
      nativeVideo.onloadedmetadata = () => {
        totalTimeDisplay.textContent = formatTime(nativeVideo.duration);
      };
      nativeVideo.ontimeupdate = () => {
        if (nativeVideo.duration) {
          currentTimeDisplay.textContent = formatTime(nativeVideo.currentTime);
          const pct = (nativeVideo.currentTime / nativeVideo.duration) * 100;
          scrubFill.style.width = pct + '%';
          scrubHandle.style.left = pct + '%';
        }
      };
      nativeVideo.play().then(() => {
        isPlaying = true;
        updatePlayPauseIcon(true);
        requestWakeLock();
      }).catch(() => {});
    } else {
      playerCard.style.display = 'none';
      emptyState.style.display = 'flex';
    }
  }

  // Clicar na barra de progresso para seek em vídeos nativos
  scrubContainer.onclick = (e) => {
    if (!isNative || !nativeVideo.duration) return;
    const rect = scrubContainer.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const pct = Math.max(0, Math.min(1, clickX / rect.width));
    nativeVideo.currentTime = nativeVideo.duration * pct;
    scrubFill.style.width = (pct * 100) + '%';
    scrubHandle.style.left = (pct * 100) + '%';
  };

  // Leitura dinâmica do link pela URL (Hash ou Query Parameter)
  function lerLinkDaUrl() {
    let link = '';

    if (window.location.hash && window.location.hash.length > 1) {
      link = decodeURIComponent(window.location.hash.substring(1));
    }

    if (!link) {
      const params = new URLSearchParams(window.location.search);
      link = params.get('v') || params.get('url') || params.get('f');
    }

    carregarVideo(link);
  }

  window.onhashchange = lerLinkDaUrl;
  window.onload = lerLinkDaUrl;
</script>
